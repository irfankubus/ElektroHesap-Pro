<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ElektroHesap Pro — Elektrik Mühendisliği Hesaplama Portalı</title>
  <meta name="description" content="Elektrik mühendisleri için modern, açık temalı hesaplama modülleri: Kablo kesidi, trafo & kompanzasyon, busbar, orta gerilim, NYY tablo, sorti hesapları." />
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />

<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="./css/layout.css" />
<link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <script src="../js/app-data.js"></script>
<script src="../js/main.js"></script>
  <script>
    (async function () {
      const root = Shell.renderShell({
        title: "ElektroHesap Pro",
        subtitle: "Elektrik mühendisliği hesaplama portalı"
      });

      const modules = [
        {
          key: "kablo",
          href: "./pages/kablo-kesidi.html",
          icon: Shell.ICONS.cable,
          title: "Kablo Kesidi Hesaplama",
          desc: "Çekilen güç, gerilim ve mesafeye göre kablo kesiti, akım taşıma ve gerilim düşümü hesabı."
        },
        {
          key: "trafo",
          href: "./pages/trafo.html",
          icon: Shell.ICONS.zap,
          title: "Trafo & Kompanzasyon",
          desc: "Güç faktörü düzeltme, trafo gücü tespiti ve şalter seçim modülü."
        },
        {
          key: "busbar",
          href: "./pages/busbar.html",
          icon: Shell.ICONS.rows,
          title: "Busbar Hatları",
          desc: "A ve B kolu busbar hatlarında hat boyunca gerilim düşümü analizleri."
        },
        {
          key: "og",
          href: "./pages/orta-gerilim.html",
          icon: Shell.ICONS.bolt,
          title: "Orta Gerilim Malzeme",
          desc: "Primer/sekonder akımları, trafo oransal koruma ve ölçü akım trafosu seçimi."
        },
        {
          key: "nyy",
          href: "./pages/nyy.html",
          icon: Shell.ICONS.table,
          title: "NYY Kablo Veri Tablosu",
          desc: "NYY kablo kesit, çap, direnç, toprak/hava akım taşıma kapasiteleri."
        },
        {
          key: "sorti",
          href: "./pages/sorti.html",
          icon: Shell.ICONS.plug,
          title: "Sorti Hesapları",
          desc: "Sıva altı ve nemli yer lamba/priz sortileri malzeme maliyet analizleri."
        },
      ];

      const statsStrip = `
        <div class="info-strip" id="statsStrip" data-testid="stats-strip">
          <div style="display:flex;align-items:center;gap:0.7rem">
            <div style="width:38px;height:38px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="display:inline-flex;width:18px;height:18px">${Shell.ICONS.info}</span></div>
            <div>
              <div style="font-family:var(--font-display);font-weight:600;color:var(--text-primary)">Mühendisler için sadeleştirilmiş hesap seti</div>
              <div style="font-size:0.82rem;color:var(--text-muted)">6 modül · 43 NYY kesiti · 52 busbar tipi · TSE / IEC standartları</div>
            </div>
          </div>
          <div class="stats" id="liveStats" style="margin-left:auto">
            <div class="stat"><div class="stat-value" id="statCalc">—</div><div class="stat-label">Toplam Hesap</div></div>
            <div class="stat"><div class="stat-value" id="statVisit">—</div><div class="stat-label">Ziyaret</div></div>
          </div>
        </div>
      `;

      const heroHtml = `
        <div style="margin-bottom:2rem">
          <div style="display:inline-flex;align-items:center;gap:0.4rem;padding:0.35rem 0.75rem;border-radius:999px;background:var(--primary-light);color:var(--primary);font-size:0.78rem;font-weight:600;margin-bottom:1rem">
            ${Shell.ICONS.check}<span>Mühendislik hesapları · tek çatı altında</span>
          </div>
          <h1 style="font-size:2.1rem;line-height:1.15">Elektrik projelerinizin tüm hesaplamalarını<br/><span style="color:var(--primary)">tek yerden</span> yönetin.</h1>
          <p style="max-width:640px;margin-top:0.5rem;font-size:0.95rem">Kablo kesidinden trafo gücüne, busbar gerilim düşümünden orta gerilim koruma seçimine kadar altı temel modül — tüm formüller mevcut mühendislik projeleriyle birebir uyumlu.</p>
        </div>
      `;

      const cards = modules.map(m => `
        <a class="module-card" href="${m.href}" data-testid="module-card-${m.key}">
          <div class="module-card-icon">${m.icon}</div>
          <div>
            <div class="module-card-title">${m.title}</div>
            <div class="module-card-desc">${m.desc}</div>
          </div>
          <div class="module-card-cta">Aç ${Shell.ICONS.arrow}</div>
        </a>
      `).join("");

      root.innerHTML = heroHtml + statsStrip + `<div class="grid" data-testid="modules-grid">${cards}</div>`;

      try {
        const s = await window.API.stats();
        document.getElementById("statCalc").textContent = Shell.fmt(s.total_calculations, 0);
        document.getElementById("statVisit").textContent = Shell.fmt(s.visits, 0);
      } catch (e) {
        document.getElementById("statCalc").textContent = "0";
        document.getElementById("statVisit").textContent = "0";
      }
    })();
  </script>
</body>
</html>
